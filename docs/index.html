<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>jiggle</title>
<meta name="description" content="Shake your mouse. Your Dock comes to you. A tiny Mac app.">
<meta name="theme-color" content="#2b3be8">
<link rel="icon" href="logo.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="logo.png">
<meta property="og:image" content="https://cullen-b.github.io/jiggle/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&display=swap" rel="stylesheet">
<style>
  :root {
    --field: #2b3be8;
    --ink: #12184a;
    --paper: #f7f7ff;
    --dot: rgba(255, 255, 255, 0.2);
    --spring: cubic-bezier(.34, 1.56, .64, 1);
    --tile: 64px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body {
    background: var(--field);
    color: var(--paper);
    font-family: system-ui, -apple-system, sans-serif;
    touch-action: none;
    -webkit-user-select: none;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }

  /* Follower: a ring that trails the pointer and fills up as you shake. */
  #follower {
    position: fixed; left: 0; top: 0; width: 56px; height: 56px;
    margin: -28px 0 0 -28px; pointer-events: none; z-index: 3;
    transition: opacity .2s;
  }
  #follower svg { width: 100%; height: 100%; overflow: visible; }
  #follower .track { stroke: rgba(255, 255, 255, .35); }
  #follower .meter { stroke: var(--paper); transition: stroke-dashoffset .12s ease-out; }
  #follower .mouse { opacity: 0; transition: opacity .4s; }
  #follower.hint .mouse { opacity: 1; animation: shake 1.6s ease-in-out infinite; transform-origin: 28px 28px; }
  body.open #follower { opacity: 0; }

  @keyframes shake {
    0%, 45%, 100% { transform: translateX(0) rotate(0); }
    50% { transform: translateX(-7px) rotate(-8deg); }
    60% { transform: translateX(7px) rotate(8deg); }
    70% { transform: translateX(-7px) rotate(-8deg); }
    80% { transform: translateX(7px) rotate(8deg); }
    90% { transform: translateX(0) rotate(0); }
  }

  /* The ring of apps. */
  #ring { position: fixed; left: 0; top: 0; width: 0; height: 0; z-index: 2; pointer-events: none; }
  #disc {
    position: absolute; border-radius: 50%;
    background: rgba(255, 255, 255, .16);
    -webkit-backdrop-filter: blur(14px) saturate(1.4);
    backdrop-filter: blur(14px) saturate(1.4);
    box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .35), 0 30px 80px -20px rgba(8, 12, 60, .55);
    transform: scale(.2); opacity: 0;
    transition: transform .35s var(--spring), opacity .2s;
  }
  body.open #disc { transform: scale(1); opacity: 1; }
  /* The aimed slice: centered on --wc, half as wide as --wh (clockwise from 12 o'clock). */
  @property --wc { syntax: '<angle>'; inherits: false; initial-value: 0deg; }
  @property --wh { syntax: '<angle>'; inherits: false; initial-value: 20deg; }
  #wedge {
    position: absolute; inset: 0; border-radius: 50%; opacity: 0;
    background: conic-gradient(from calc(var(--wc) - var(--wh)), rgba(255, 255, 255, .2) 0deg calc(var(--wh) * 2), transparent 0deg);
    transition: --wc .16s ease-out, --wh .16s ease-out, opacity .2s;
  }
  body.picking #wedge { opacity: 1; }
  #name {
    position: absolute; left: 0; top: 0; transform: translate(-50%, -50%); z-index: 1;
    padding: 5px 11px; border-radius: 999px; white-space: nowrap; pointer-events: none;
    font: 500 13px/1.2 system-ui, -apple-system, sans-serif; color: #fff; background: rgba(0, 0, 0, .45);
    opacity: 0; transition: opacity .15s;
  }
  body.picking #name { opacity: 1; }
  .tile {
    position: absolute; left: 0; top: 0;
    width: var(--tile); height: var(--tile); margin: calc(var(--tile) / -2) 0 0 calc(var(--tile) / -2);
    border: 0; border-radius: 23%; padding: 0; cursor: pointer; background: none;
    box-shadow: 0 12px 22px -10px rgba(8, 12, 60, .7);
    transform: translate(0, 0) scale(.1); opacity: 0;
    transition: transform .45s var(--spring), opacity .2s, filter .2s;
    transition-delay: calc(var(--i) * 22ms);
  }
  .tile svg { display: block; width: 100%; height: 100%; }
  body.open .tile { pointer-events: auto; opacity: 1; transform: translate(var(--x), var(--y)) scale(var(--s, 1)); }
  /* Once the pointer is aiming, tiles follow it briskly instead of springing in one by one. */
  body.aiming .tile { transition: transform .16s ease-out, opacity .2s, filter .2s; transition-delay: 0s; }
  body.open .tile.sel { z-index: 1; }
  body.open.picking .tile:not(.sel) { filter: brightness(.94); }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
  .tile:focus-visible { outline: 3px solid var(--paper); outline-offset: 4px; }
  .tile .run {
    position: absolute; bottom: -10px; left: 50%; width: 5px; height: 5px; margin-left: -2.5px;
    border-radius: 50%; background: var(--paper); opacity: .85;
  }

  /* An opened app: a small window pops out of the tile, then tucks back in. */
  #app {
    position: fixed; left: 0; top: 0; z-index: 5; width: 240px; margin-left: -120px;
    border-radius: 14px; overflow: hidden; cursor: pointer; display: none;
    background: rgba(248, 249, 255, .94);
    -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px);
    box-shadow: 0 0 0 1px rgba(255, 255, 255, .6), 0 30px 60px -15px rgba(8, 12, 60, .65);
    transform: translate(var(--fx), var(--fy)) scale(.15); opacity: 0;
    transition: transform .45s var(--spring), opacity .18s;
  }
  #app.show { display: block; }
  #app.pop { transform: translate(var(--tx), var(--ty)) scale(1); opacity: 1; }
  #app .bar { position: relative; height: 30px; display: flex; align-items: center; gap: 7px; padding: 0 11px; background: rgba(18, 24, 74, .05); }
  #app .bar i { width: 11px; height: 11px; border-radius: 50%; background: #ff5f57; }
  #app .bar i:nth-child(2) { background: #febc2e; }
  #app .bar i:nth-child(3) { background: #28c840; }
  #app .bar span { position: absolute; inset: 0; display: grid; place-items: center; font: 600 12.5px/1 system-ui, -apple-system, sans-serif; color: rgba(18, 24, 74, .65); }
  #app .body { height: 130px; display: grid; place-items: center; }
  #app .body svg { width: 76px; height: 76px; filter: drop-shadow(0 8px 14px rgba(8, 12, 60, .3)); animation: hop .55s .08s var(--spring) both; }
  @keyframes hop { from { transform: scale(.4) rotate(-14deg); } to { transform: none; } }

  /* Corners: the only words on the page. */
  .mark {
    position: fixed; left: calc(24px + env(safe-area-inset-left)); bottom: calc(18px + env(safe-area-inset-bottom)); z-index: 4;
    font-family: "Bagel Fat One", system-ui, sans-serif; font-size: clamp(40px, 7vw, 84px); line-height: 1;
    color: var(--paper); text-decoration: none; display: flex; pointer-events: auto;
  }
  .mark span { display: inline-block; transform: rotate(var(--r, 0deg)) translateY(var(--dy, 0px)); }
  .corner {
    position: fixed; right: calc(22px + env(safe-area-inset-right)); bottom: calc(22px + env(safe-area-inset-bottom)); z-index: 4;
    display: flex; align-items: center; gap: 10px;
  }
  .gh {
    width: 44px; height: 44px; flex: none;
    display: grid; place-items: center; border-radius: 50%; color: var(--paper);
    background: rgba(255, 255, 255, .12); transition: background .2s, transform .2s var(--spring);
  }
  .gh:hover { background: rgba(255, 255, 255, .24); transform: scale(1.08); }
  .gh svg { width: 24px; height: 24px; fill: currentColor; }
  .gh.coffee svg { fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .ask {
    height: 44px; flex: none; padding: 0 18px 0 14px; border: 0; border-radius: 22px; cursor: pointer;
    display: flex; align-items: center; gap: 8px;
    font: 600 15px/1 system-ui, -apple-system, sans-serif; color: var(--ink); background: var(--paper);
    box-shadow: 0 10px 24px -10px rgba(8, 12, 60, .6);
    transition: transform .25s var(--spring), background-color .2s;
  }
  .ask:hover { transform: translateY(-2px) scale(1.03); }
  .ask:active { transform: scale(.96); }
  .ask svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .ask .done { display: none; }
  .ask.copied { background: #3ddc97; }
  .ask.copied .idle { display: none; }
  .ask.copied .done { display: inline; }
  .mark:focus-visible, .gh:focus-visible, .ask:focus-visible { outline: 3px solid var(--paper); outline-offset: 4px; border-radius: 12px; }

  @media (max-width: 600px) { .ask .wide { display: none; } .ask { padding: 0 14px 0 12px; font-size: 14px; } :root { --tile: 52px; } .mark { left: calc(16px + env(safe-area-inset-left)); font-size: 30px; } .corner { right: calc(16px + env(safe-area-inset-right)); gap: 8px; } }
  @media (hover: none) { #follower { display: none; } }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { transition-duration: 0s !important; transition-delay: 0s !important; animation: none !important; }
  }
</style>
</head>
<body>
<h1 class="sr">jiggle: shake your mouse and your Dock apps appear around the pointer. Press Space to try it.</h1>
<canvas id="dots" aria-hidden="true"></canvas>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <linearGradient id="g-files-bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f6faff"/><stop offset="1" stop-color="#d3e3f8"/></linearGradient>
    <linearGradient id="g-files-back" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4f9dff"/><stop offset="1" stop-color="#1a64d6"/></linearGradient>
    <linearGradient id="g-files-front" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8fc6ff"/><stop offset="1" stop-color="#3a8af2"/></linearGradient>
    <linearGradient id="g-music-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffd25e"/><stop offset=".55" stop-color="#ff9a2e"/><stop offset="1" stop-color="#f2621f"/></linearGradient>
    <linearGradient id="g-term-bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3d424c"/><stop offset="1" stop-color="#111317"/></linearGradient>
    <linearGradient id="g-sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6cc6ff"/><stop offset="1" stop-color="#2670ea"/></linearGradient>
    <radialGradient id="g-sun" cx=".4" cy=".35" r=".7"><stop offset="0" stop-color="#fff7b8"/><stop offset=".55" stop-color="#ffc928"/><stop offset="1" stop-color="#ff9a1a"/></radialGradient>
    <linearGradient id="g-cloud" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#dbe6f4"/></linearGradient>
    <linearGradient id="g-cal-bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#e7eaf0"/></linearGradient>
    <linearGradient id="g-cal-top" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff6a5f"/><stop offset="1" stop-color="#e2302a"/></linearGradient>
    <linearGradient id="g-gh-bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3a414b"/><stop offset="1" stop-color="#0d1117"/></linearGradient>
    <linearGradient id="g-coffee-bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d89a62"/><stop offset="1" stop-color="#8a4b22"/></linearGradient>
    <linearGradient id="g-dl-bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6ff0a8"/><stop offset="1" stop-color="#14a34a"/></linearGradient>
    <linearGradient id="g-val-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#232846"/><stop offset="1" stop-color="#3a2558"/></linearGradient>
    <radialGradient id="g-val-glow" cx=".15" cy=".95" r=".8"><stop offset="0" stop-color="#9d8cff" stop-opacity=".55"/><stop offset="1" stop-color="#9d8cff" stop-opacity="0"/></radialGradient>
    <linearGradient id="g-val-v" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#d9d3ff"/></linearGradient>
    <linearGradient id="g-gloss" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".28"/><stop offset=".5" stop-color="#fff" stop-opacity="0"/></linearGradient>
    <filter id="g-drop" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="2.5" stdDeviation="2.5" flood-color="#0b1440" flood-opacity=".3"/></filter>
  </defs>
</svg>

<div id="follower" aria-hidden="true">
  <svg viewBox="0 0 56 56">
    <circle class="track" cx="28" cy="28" r="22" fill="none" stroke-width="2"/>
    <circle class="meter" cx="28" cy="28" r="22" fill="none" stroke-width="4" stroke-linecap="round"
            transform="rotate(-90 28 28)" stroke-dasharray="138.2" stroke-dashoffset="138.2"/>
    <g class="mouse" fill="none" stroke="#f7f7ff" stroke-width="2">
      <rect x="22" y="18" width="12" height="20" rx="6"/><path d="M28 22v4"/>
    </g>
  </svg>
</div>

<div id="ring"><div id="disc"><div id="wedge"></div></div><div id="name"></div></div>
<div id="app" role="status"></div>

<a class="mark" translate="no" href="https://github.com/cullen-b/jiggle" aria-label="jiggle on GitHub"><span>j</span><span>i</span><span>g</span><span>g</span><span>l</span><span>e</span></a>
<div class="corner">
<button class="ask" type="button" aria-describedby="ask-status">
  <svg class="idle" viewBox="0 0 24 24" aria-hidden="true"><rect x="8" y="8" width="12" height="12" rx="2.5"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"/></svg>
  <svg class="done" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>
  <span class="idle">Copy <span class="wide">install </span>prompt</span><span class="done">Copied<span class="wide">, paste it to your agent</span></span>
</button>
<a class="gh coffee" href="https://payme.cullenbaker.com" aria-label="Buy me a coffee" title="Buy me a coffee">
  <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 9h11v5a5 5 0 0 1-5 5H10a5 5 0 0 1-5-5z"/><path d="M16 10.5h1.5a2.5 2.5 0 0 1 0 5H16"/><path d="M8.5 3.5c-.6.8.6 1.7 0 2.5M12 3.5c-.6.8.6 1.7 0 2.5"/></svg>
</a>
<a class="gh" href="https://github.com/cullen-b/jiggle" aria-label="Source code on GitHub" title="Source code on GitHub">
  <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/></svg>
</a>
</div>
<span id="ask-status" class="sr" aria-live="polite"></span>

<script>
(() => {
  const now = new Date();
  const month = now.toLocaleString('en', { month: 'short' }).toUpperCase();
  const bg = (id) => `<rect width="100" height="100" rx="23" fill="url(#${id})"/>`;
  const gloss = '<rect width="100" height="100" rx="23" fill="url(#g-gloss)"/>';
  const REPO = 'https://github.com/cullen-b/jiggle';
  // Some tiles go somewhere: href opens a new tab, download saves a file, copy copies the install prompt.
  const APPS = [
    { name: 'Download Jiggle', download: REPO + '/releases/latest/download/Jiggle.zip', art: bg('g-dl-bg') + gloss +
      '<g fill="none" stroke="#fff" stroke-linecap="round" stroke-linejoin="round" filter="url(#g-drop)"><path d="M50 20v42M31 45l19 19 19-19" stroke-width="9"/><path d="M24 70v7h52v-7" stroke-width="8"/></g>' },
    { name: 'Jiggle on GitHub', href: REPO, art: bg('g-gh-bg') +
      '<path transform="translate(20 20) scale(3.75)" fill="#fff" d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/>' },
    { name: 'Music', run: 1, href: 'https://www.youtube.com/watch?v=dQw4w9WgXcQ', art: bg('g-music-bg') + gloss +
      '<g fill="#fff" filter="url(#g-drop)"><path d="M40 33 74 25v10l-34 8z"/><rect x="40" y="33" width="6" height="37"/><rect x="68" y="25" width="6" height="37"/>' +
      '<ellipse cx="36" cy="70" rx="10.5" ry="8" transform="rotate(-20 36 70)"/><ellipse cx="64" cy="62" rx="10.5" ry="8" transform="rotate(-20 64 62)"/></g>' },
    { name: 'Buy me a coffee', href: 'https://payme.cullenbaker.com', art: bg('g-coffee-bg') + gloss +
      '<g fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round" opacity=".85"><path d="M38 17c-3 4 3 7 0 11M50 15c-3 4 3 7 0 11M62 17c-3 4 3 7 0 11"/></g>' +
      '<path d="M70 44h4a10 10 0 0 1 0 20h-4" fill="none" stroke="#fff" stroke-width="6" filter="url(#g-drop)"/>' +
      '<path d="M24 38h48v24a18 18 0 0 1-18 18H42a18 18 0 0 1-18-18z" fill="#fff" filter="url(#g-drop)"/>' +
      '<ellipse cx="48" cy="38" rx="24" ry="4.5" fill="#6b3a1c"/>' },
    { name: 'Calendar', art: bg('g-cal-bg') +
      '<path d="M0 23A23 23 0 0 1 23 0h54a23 23 0 0 1 23 23v7H0z" fill="url(#g-cal-top)"/>' +
      `<text x="50" y="21.5" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="15" font-weight="700" fill="#fff" letter-spacing="1">${month}</text>` +
      `<text x="50" y="80" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="48" font-weight="500" fill="#1d2230">${now.getDate()}</text>` },
    { name: 'Terminal', title: 'Install prompt copied', run: 1, copy: true, art: bg('g-term-bg') +
      '<circle cx="19" cy="18" r="4" fill="#ff5f57"/><circle cx="31" cy="18" r="4" fill="#febc2e"/><circle cx="43" cy="18" r="4" fill="#28c840"/>' +
      '<path d="M24 45l14 11-14 11" fill="none" stroke="#4ade80" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>' +
      '<path d="M46 69h28" stroke="#e8eaf0" stroke-width="7" stroke-linecap="round"/>' },
    { name: 'Weather', art: bg('g-sky') + gloss +
      '<circle cx="40" cy="40" r="17" fill="url(#g-sun)"/>' +
      '<path d="M30 79h42a14 14 0 0 0 1-28 18 18 0 0 0-34-3 13 13 0 0 0-9 31z" fill="url(#g-cloud)" filter="url(#g-drop)"/>' },
    { name: 'Valerie browser', run: 1, href: 'https://cullen-b.github.io/valerie/', art: bg('g-val-bg') +
      '<rect width="100" height="100" rx="23" fill="url(#g-val-glow)"/>' +
      '<path d="M26.5 29.1 43.9 72.8Q50 86.4 56.1 72.8L73.5 29.1" fill="none" stroke="url(#g-val-v)" stroke-width="11.2" stroke-linecap="round" stroke-linejoin="round"/>' +
      '<circle cx="77.9" cy="74.8" r="6.6" fill="#ff7ab6"/>' },
    { name: 'Files', art: bg('g-files-bg') +
      '<path d="M17 29a5 5 0 0 1 5-5h17l7 7h32a5 5 0 0 1 5 5v38a6 6 0 0 1-6 6H23a6 6 0 0 1-6-6z" fill="url(#g-files-back)"/>' +
      '<path d="M13 43a5 5 0 0 1 5-5h64a5 5 0 0 1 5 5v31a6 6 0 0 1-6 6H19a6 6 0 0 1-6-6z" fill="url(#g-files-front)" filter="url(#g-drop)"/>' +
      '<path d="M18 42.5h64" stroke="#fff" stroke-opacity=".6" stroke-width="2" stroke-linecap="round"/>' },
  ];
  const icon = (i) => `<svg viewBox="0 0 100 100" aria-hidden="true">${APPS[i].art}</svg>`;
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const body = document.body;
  const ring = document.getElementById('ring');
  const disc = document.getElementById('disc');
  const follower = document.getElementById('follower');
  const meter = follower.querySelector('.meter');
  const appEl = document.getElementById('app');
  const letters = [...document.querySelectorAll('.mark span')];

  // Shake detection, same rule as the Mac app: 4 reversals of 40px+ legs within 600ms.
  const REVERSALS = 4, MIN_LEG = 40, WINDOW = 600, CIRC = 138.2;
  const axis = () => ({ dir: 0, leg: 0, flips: [] });
  let ax = axis(), ay = axis();
  function feed(a, d, now) {
    const dir = Math.sign(d);
    if (dir === a.dir) a.leg += Math.abs(d);
    else if (dir && Math.abs(d) >= 3) {
      if (a.leg >= MIN_LEG) a.flips.push(now);
      a.dir = dir; a.leg = Math.abs(d);
    }
    while (a.flips.length && now - a.flips[0] > WINDOW) a.flips.shift();
    return a.flips.length;
  }

  // Tiles.
  const tiles = APPS.map((a, i) => {
    const b = document.createElement('button');
    b.className = 'tile';
    b.style.setProperty('--i', i);
    b.setAttribute('aria-label', a.name);
    b.tabIndex = -1;
    b.innerHTML = icon(i) + (a.run ? '<span class="run"></span>' : '');
    b.addEventListener('focus', () => { if (!open) return; body.classList.add('aiming'); select(i); applyLayout(i, 0.6); });
    b.addEventListener('click', (e) => { e.stopPropagation(); launch(i); });
    ring.appendChild(b);
    return b;
  });

  let open = false, sel = -1, cx = 0, cy = 0, R = 120, outerR = 170, everOpened = false;
  const wedge = document.getElementById('wedge');
  const nameEl = document.getElementById('name');

  // Aiming, same as the Mac app: as the pointer moves from the hub toward the ring, the slice it points
  // into widens and nearby tiles grow while the far side makes room. Angles are degrees clockwise from 12.
  const AIM_GROW = 1.1, AIM_SPREAD = 0.9, ICON_GROW = 0.45, ICON_SHRINK = 0.12, SEL_BONUS = 0.1, HUB = 24;
  let centers = [], widths = [], wedgeC = 0;
  const wrapDeg = (d) => ((d % 360) + 540) % 360 - 180;
  function aimLayout(s, t) {
    const n = APPS.length, step = 360 / n;
    if (s < 0) return { c: APPS.map((_, i) => i * step), w: APPS.map(() => step), sc: APPS.map(() => 1) };
    const g = APPS.map((_, i) => { let d = ((i - s) % n + n) % n; d = Math.min(d, n - d); return Math.exp(-((d / AIM_SPREAD) ** 2)); });
    const wt = g.map((x) => 1 + AIM_GROW * t * x);
    const total = wt.reduce((a, b) => a + b, 0);
    const w = wt.map((x) => 360 * x / total), c = new Array(n);
    c[s] = s * step;
    for (let k = 1; k < n; k++) { const i = (s + k) % n, p = (s + k - 1) % n; c[i] = c[p] + (w[p] + w[i]) / 2; }
    const sc = g.map((x, i) => 1 + t * (ICON_GROW * x - ICON_SHRINK * (1 - x)) + (i === s ? SEL_BONUS : 0));
    return { c, w, sc };
  }
  function applyLayout(s, t) {
    const L = aimLayout(s, t);
    centers = L.c; widths = L.w;
    tiles.forEach((tile, i) => {
      const a = L.c[i] * Math.PI / 180;
      tile.style.setProperty('--x', `${R * Math.sin(a)}px`);
      tile.style.setProperty('--y', `${-R * Math.cos(a)}px`);
      tile.style.setProperty('--s', L.sc[i].toFixed(3));
    });
    if (s >= 0) {
      wedgeC += wrapDeg(L.c[s] - wedgeC);
      wedge.style.setProperty('--wc', `${wedgeC}deg`);
      wedge.style.setProperty('--wh', `${L.w[s] / 2}deg`);
    }
  }
  let px = innerWidth / 2, py = innerHeight / 2, lastX = null, lastY = null;
  let fx = px, fy = py, energy = 0, lastTap = 0;

  function layout() {
    R = Math.min(130, Math.max(92, innerWidth * 0.28));
    const tile = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--tile'));
    const outer = R + tile / 2 + 20;
    disc.style.cssText = `width:${outer * 2}px;height:${outer * 2}px;left:${-outer}px;top:${-outer}px`;
    outerR = outer;
    applyLayout(-1, 0);
    return outer;
  }

  function show(x, y) {
    const outer = layout();
    const m = 8;
    cx = Math.min(Math.max(x, outer + m), innerWidth - outer - m);
    cy = Math.min(Math.max(y, outer + m), innerHeight - outer - m);
    if (innerWidth < outer * 2 + m * 2) cx = innerWidth / 2;
    if (innerHeight < outer * 2 + m * 2) cy = innerHeight / 2;
    ring.style.transform = `translate(${cx}px, ${cy}px)`;
    open = true; everOpened = true;
    follower.classList.remove('hint');
    body.classList.add('open');
    tiles.forEach(t => t.tabIndex = 0);
    select(-1);
    ax = axis(); ay = axis();
  }

  function hide() {
    open = false;
    body.classList.remove('open', 'picking', 'aiming');
    tiles.forEach(t => t.tabIndex = -1);
    select(-1);
    ax = axis(); ay = axis();
  }

  function select(i) {
    if (i === sel) return;
    if (sel >= 0) tiles[sel].classList.remove('sel');
    const from = sel;
    sel = i;
    if (sel >= 0) {
      tiles[sel].classList.add('sel');
      nameEl.textContent = APPS[sel].name;
      // Appearing from nothing, the slice starts where it is rather than sweeping in from the last one.
      if (from < 0) {
        wedge.style.transition = 'none';
        applyLayout(sel, 0);
        void wedge.offsetWidth;
        wedge.style.transition = '';
      }
    }
    body.classList.toggle('picking', sel >= 0);
  }

  // Which tile's slice (as currently laid out) the point is in, and how far out it is (0 at the hub, 1 at the ring).
  function pick(x, y) {
    const dx = x - cx, dy = y - cy, d = Math.hypot(dx, dy);
    if (d < HUB || d > outerR) return { i: -1, t: 0 };
    const angle = Math.atan2(dx, -dy) * 180 / Math.PI;
    let best = -1, bestRel = Infinity;
    centers.forEach((c, i) => {
      const rel = Math.abs(wrapDeg(angle - c)) / (widths[i] / 2);
      if (rel < bestRel) { bestRel = rel; best = i; }
    });
    const u = Math.min(1, Math.max(0, (d - HUB) / (R - HUB)));
    return { i: best, t: u * u * (3 - 2 * u) };
  }
  function aimAt(x, y) {
    const p = pick(x, y);
    body.classList.add('aiming');
    select(p.i);
    applyLayout(p.i, p.t);
  }

  // Opening an app: a small window pops out of the tile, then tucks back in.
  let appOpen = false, appTimer;
  function launch(i) {
    const r = tiles[i].getBoundingClientRect();
    const W = 240, H = 160, m = 12;
    const tx = Math.min(Math.max(cx, W / 2 + m), innerWidth - W / 2 - m);
    const ty = Math.min(Math.max(cy, H / 2 + m), innerHeight - H / 2 - m);
    appEl.style.setProperty('--fx', `${r.left + r.width / 2}px`);
    appEl.style.setProperty('--fy', `${r.top + r.height / 2 - H / 2}px`);
    appEl.style.setProperty('--tx', `${tx}px`);
    appEl.style.setProperty('--ty', `${ty - H / 2}px`);
    const a = APPS[i];
    if (a.href) window.open(a.href, '_blank', 'noopener');
    if (a.download) location.href = a.download;
    if (a.copy) copyPrompt();
    appEl.innerHTML = `<div class="bar"><i></i><i></i><i></i><span>${a.title || a.name}</span></div><div class="body">${icon(i)}</div>`;
    hide();
    appEl.classList.remove('pop');
    appEl.classList.add('show');
    void appEl.offsetWidth;
    appEl.classList.add('pop');
    appOpen = true;
    clearTimeout(appTimer);
    appTimer = setTimeout(closeApp, 1700);
    if (navigator.vibrate) navigator.vibrate(20);
  }
  function closeApp() {
    if (!appOpen) return;
    appOpen = false;
    clearTimeout(appTimer);
    appEl.classList.remove('pop');
    setTimeout(() => { if (!appOpen) appEl.classList.remove('show'); }, reduced ? 0 : 320);
  }
  appEl.addEventListener('click', closeApp);

  // Pointer.
  addEventListener('pointermove', (e) => {
    px = e.clientX; py = e.clientY;
    if (appOpen) { lastX = lastY = null; return; }
    if (open) { aimAt(px, py); return; }
    if (lastX !== null) {
      const now = performance.now();
      const dx = px - lastX, dy = py - lastY;
      const n = Math.max(feed(ax, dx, now), feed(ay, dy, now));
      energy = Math.min(1, energy + Math.hypot(dx, dy) / 400);
      meter.style.strokeDashoffset = CIRC * (1 - n / REVERSALS);
      if (n >= REVERSALS) show(px, py);
    }
    lastX = px; lastY = py;
    wake();
  }, { passive: true });
  addEventListener('pointerup', (e) => { if (e.pointerType !== 'mouse') lastX = lastY = null; });
  addEventListener('pointerdown', (e) => {
    lastX = e.clientX; lastY = e.clientY;
    if (appOpen && !e.target.closest('#app')) closeApp();
    // Double-tap opens the ring on touch screens, as an alternative to shaking.
    if (!open && !appOpen && e.pointerType !== 'mouse' && !e.target.closest('a, button')) {
      const now = performance.now();
      if (now - lastTap < 300) show(e.clientX, e.clientY);
      lastTap = now;
      return;
    }
    if (!open || e.target.closest('.tile, a, .ask')) return;
    const i = pick(e.clientX, e.clientY).i;
    if (i >= 0 && e.pointerType === 'mouse') launch(i); else hide();
  });
  addEventListener('contextmenu', (e) => { if (open) { e.preventDefault(); hide(); } });

  // Keyboard: Space opens at the pointer, arrows choose, Enter opens, Esc closes.
  addEventListener('keydown', (e) => {
    if (appOpen) { if (['Escape', 'Enter', ' '].includes(e.key)) { e.preventDefault(); closeApp(); } return; }
    if (!open) {
      if (e.key === ' ' && !e.target.closest('a, button')) { e.preventDefault(); show(px, py); select(0); tiles[0].focus({ preventScroll: true }); }
      return;
    }
    const n = APPS.length;
    if (e.key === 'Escape') { hide(); }
    else if (e.key === 'ArrowRight' || e.key === 'ArrowDown') { e.preventDefault(); tiles[(Math.max(sel, -1) + 1) % n].focus({ preventScroll: true }); }
    else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') { e.preventDefault(); tiles[(sel <= 0 ? n : sel) - 1].focus({ preventScroll: true }); }
    else if ((e.key === 'Enter' || e.key === ' ') && sel >= 0) { e.preventDefault(); launch(sel); }
  });

  // Hint: if nobody has shaken yet, the follower wiggles a little mouse.
  let idle;
  function poke() {
    clearTimeout(idle);
    follower.classList.remove('hint');
    if (!everOpened) idle = setTimeout(() => follower.classList.add('hint'), 2200);
  }
  addEventListener('pointermove', poke, { passive: true });
  poke();

  // Dot field: dots lean away from the pointer and wobble with shake energy.
  const cv = document.getElementById('dots');
  const ctx = cv.getContext('2d');
  let W, H, dpr, running = false;
  function resize() {
    dpr = Math.min(devicePixelRatio || 1, 2);
    W = innerWidth; H = innerHeight;
    cv.width = W * dpr; cv.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    if (open) hide();
    draw(performance.now());
  }
  addEventListener('resize', resize);

  function draw(t) {
    ctx.clearRect(0, 0, W, H);
    ctx.fillStyle = 'rgba(255,255,255,0.22)';
    const S = 28, reach = 140;
    const wob = reduced ? 0 : energy * 6;
    ctx.beginPath();
    for (let y = S / 2; y < H + S; y += S) {
      for (let x = S / 2; x < W + S; x += S) {
        let dx = x - fx, dy = y - fy, d = Math.hypot(dx, dy), ox = 0, oy = 0, r = 1.6;
        if (d < reach && d > 0.01) {
          const f = (1 - d / reach) ** 2;
          ox = dx / d * f * 18; oy = dy / d * f * 18; r += f * 1.4;
        }
        if (wob) { ox += Math.sin(t / 40 + y * 0.3) * wob; oy += Math.cos(t / 47 + x * 0.3) * wob; }
        ctx.moveTo(x + ox + r, y + oy);
        ctx.arc(x + ox, y + oy, r, 0, Math.PI * 2);
      }
    }
    ctx.fill();
  }

  function frame(t) {
    const k = reduced ? 1 : 0.22;
    fx += (px - fx) * k; fy += (py - fy) * k;
    energy *= 0.93;
    follower.style.transform = `translate(${fx}px, ${fy}px) rotate(${reduced ? 0 : Math.sin(t / 30) * energy * 25}deg)`;
    letters.forEach((s, i) => {
      s.style.setProperty('--r', `${reduced ? 0 : Math.sin(t / 45 + i * 1.3) * energy * 18}deg`);
      s.style.setProperty('--dy', `${reduced ? 0 : Math.cos(t / 38 + i) * energy * 8}px`);
    });
    if (!open) {
      const filled = parseFloat(meter.style.strokeDashoffset || CIRC);
      if (energy < 0.02 && filled < CIRC) meter.style.strokeDashoffset = CIRC;
    }
    draw(t);
    if (Math.hypot(px - fx, py - fy) > 0.3 || energy > 0.005) requestAnimationFrame(frame);
    else running = false;
  }
  function wake() { if (!running) { running = true; requestAnimationFrame(frame); } }

  // Copy a prompt that lets someone's coding agent install jiggle for them.
  const PROMPT = `Install jiggle on my Mac. It's a small open-source app: shake the mouse and my Dock apps appear in a ring around the pointer. Source: https://github.com/cullen-b/jiggle

1. Read the README at https://github.com/cullen-b/jiggle first.
2. Run: git clone https://github.com/cullen-b/jiggle.git ~/jiggle && ~/jiggle/install.sh
   This downloads the latest signed release, checks its signature, installs it to ~/Applications/Jiggle.app and starts it at login. It updates itself from GitHub releases.
3. Check that it's running: pgrep -fl Jiggle.app
4. Tell me to turn on Jiggle in System Settings > Privacy & Security > Accessibility, then shake my mouse to try it.
5. Jiggle's settings live in the macOS defaults domain local.jiggle (keys OpenAppsOnly, RingOpacity, ShakeSensitivity, ExtraApps, HiddenApps, AppOrder, Shortcut; the shortcut is off unless set, e.g. ctrl+opt+space). If I ask you to change one later, use defaults write; the README's Settings section explains each key.`;
  const ask = document.querySelector('.ask');
  const askStatus = document.getElementById('ask-status');
  let askTimer;
  async function copyPrompt() {
    try { await navigator.clipboard.writeText(PROMPT); }
    catch {
      const t = document.createElement('textarea');
      t.value = PROMPT; t.setAttribute('readonly', ''); t.style.cssText = 'position:fixed;opacity:0';
      document.body.appendChild(t); t.select(); document.execCommand('copy'); t.remove();
    }
    ask.classList.add('copied');
    askStatus.textContent = 'Install prompt copied';
    clearTimeout(askTimer);
    askTimer = setTimeout(() => { ask.classList.remove('copied'); askStatus.textContent = ''; }, 2400);
  }
  ask.addEventListener('click', copyPrompt);

  resize();
  follower.style.transform = `translate(${fx}px, ${fy}px)`;
})();
</script>
</body>
</html>
