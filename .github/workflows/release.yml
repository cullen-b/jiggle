name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Tag matches Cargo.toml version
        run: test "v$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)" = "$GITHUB_REF_NAME"

      - name: Build universal binary
        run: |
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
          cargo test --release
          cargo build --release --target aarch64-apple-darwin
          cargo build --release --target x86_64-apple-darwin
          lipo -create -output jiggle target/aarch64-apple-darwin/release/jiggle target/x86_64-apple-darwin/release/jiggle
          scripts/bundle.sh jiggle dist/Jiggle.app "${GITHUB_REF_NAME#v}"

      - name: Sign with the pinned jiggle certificate
        env:
          SIGNING_P12: ${{ secrets.SIGNING_P12 }}
          SIGNING_P12_PASSWORD: ${{ secrets.SIGNING_P12_PASSWORD }}
        run: |
          kc="$RUNNER_TEMP/sign.keychain-db"
          kp=$(openssl rand -hex 12)
          printf '%s' "$SIGNING_P12" | base64 --decode > "$RUNNER_TEMP/signing.p12"
          security create-keychain -p "$kp" "$kc"
          security set-keychain-settings "$kc"
          security unlock-keychain -p "$kp" "$kc"
          security import "$RUNNER_TEMP/signing.p12" -k "$kc" -P "$SIGNING_P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$kp" "$kc" > /dev/null
          rm "$RUNNER_TEMP/signing.p12"
          codesign --force --options runtime --keychain "$kc" --sign "jiggle code signing" --identifier local.jiggle dist/Jiggle.app
          codesign --verify --deep --strict -R="$(cat scripts/requirement.txt)" dist/Jiggle.app
          security delete-keychain "$kc"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ditto -c -k --keepParent dist/Jiggle.app Jiggle.zip
          gh release create "$GITHUB_REF_NAME" Jiggle.zip --title "$GITHUB_REF_NAME" --generate-notes
